name: Waka Readme

on:
  schedule:
    # Se ejecuta todos los días a las 00:30 UTC (18:30 hora de Honduras)
    - cron: '30 0 * * *'
  workflow_dispatch:  # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  update-readme:
    name: Actualizar README con estadísticas de WakaTime
    runs-on: ubuntu-latest
    steps:
      - name: Generar estadísticas y actualizar README
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: main
        run: python3 .github/scripts/generate_waka_section.py
